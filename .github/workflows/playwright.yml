name: Playwright multi-account tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Suite vs. buggy app (defects must be detected)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Download the browser only. `install --with-deps` also apt-installs a font
      # pack (fonts-unifont, fonts-wqy-zenhei, ...) and that fetch failed on
      # ubuntu-latest. The tests do not need those fonts. Shared libraries are
      # installed only if Chromium cannot start.
      - name: Install Playwright Chromium
        run: |
          npx playwright install chromium
          probe='const {chromium}=require("@playwright/test"); (async()=>{const b=await chromium.launch(); await b.close();})().catch((e)=>{console.error(e); process.exit(1);})'
          if node -e "$probe"; then
            exit 0
          fi
          echo "Chromium did not start; installing shared libraries (no font pack)"
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libasound2t64 \
            libatk-bridge2.0-0t64 \
            libatk1.0-0t64 \
            libatspi2.0-0t64 \
            libcairo2 \
            libcups2t64 \
            libdbus-1-3 \
            libdrm2 \
            libgbm1 \
            libglib2.0-0t64 \
            libnspr4 \
            libnss3 \
            libpango-1.0-0 \
            libx11-6 \
            libxcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxext6 \
            libxfixes3 \
            libxkbcommon0 \
            libxrandr2
          node -e "$probe"
      - run: npm run typecheck

      - name: Start the demo app
        run: |
          node app/server.js > app.log 2>&1 &
          npx --yes wait-on@8 --timeout 30000 http://localhost:3210/health

      # Playwright exits 1 because the @bug tests fail on purpose; we keep going and let
      # verify-results.mjs decide: all regular tests must pass AND every @bug test must fail.
      - name: Run Playwright tests
        run: npx playwright test
        continue-on-error: true
      - name: Verify results (no regressions, all planted defects detected)
        run: node scripts/verify-results.mjs

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Upload app log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-log
          path: app.log

  fixed:
    name: Suite vs. fixed app (proves @bug tests are correct)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Download the browser only. `install --with-deps` also apt-installs a font
      # pack (fonts-unifont, fonts-wqy-zenhei, ...) and that fetch failed on
      # ubuntu-latest. The tests do not need those fonts. Shared libraries are
      # installed only if Chromium cannot start.
      - name: Install Playwright Chromium
        run: |
          npx playwright install chromium
          probe='const {chromium}=require("@playwright/test"); (async()=>{const b=await chromium.launch(); await b.close();})().catch((e)=>{console.error(e); process.exit(1);})'
          if node -e "$probe"; then
            exit 0
          fi
          echo "Chromium did not start; installing shared libraries (no font pack)"
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libasound2t64 \
            libatk-bridge2.0-0t64 \
            libatk1.0-0t64 \
            libatspi2.0-0t64 \
            libcairo2 \
            libcups2t64 \
            libdbus-1-3 \
            libdrm2 \
            libgbm1 \
            libglib2.0-0t64 \
            libnspr4 \
            libnss3 \
            libpango-1.0-0 \
            libx11-6 \
            libxcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxext6 \
            libxfixes3 \
            libxkbcommon0 \
            libxrandr2
          node -e "$probe"
      - name: Run all tests against the fixed app
        run: npm run test:fixed
        env:
          FIX_PLANTED_BUGS: '1'
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-fixed-app
          path: playwright-report/
          retention-days: 14
